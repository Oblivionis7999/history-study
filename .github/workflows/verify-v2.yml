name: Verify V2
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements-dev.txt
      - run: .venv/bin/python -m pytest tests -q
      - run: npm ci && npm run build
      - run: .venv/bin/python scripts/check_repository.py
  browsers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m venv .venv && .venv/bin/python -m pip install -r backend/requirements-dev.txt
      - run: npm ci && npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.browser }}
          path: artifacts/screenshots/v2
          retention-days: 7
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx cryptography==50.0.2
      - run: python scripts/docker_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smoke-result
          path: artifacts/docker-smoke-result.json
          retention-days: 7
