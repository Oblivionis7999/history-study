name: history-study
services:
  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DEV_MODE: "0"
      DATABASE_PATH: /app/.runtime/history.sqlite
    volumes:
      - study-data:/app/.runtime
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  study-data:
