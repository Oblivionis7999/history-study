# Isolated CI harness; never use this override on a production server.
services:
  api:
    environment:
      PUBLIC_ORIGIN: https://localhost:8443
      AI_BASE_URL: http://mock-ai:9090/v1
      AI_API_KEY: isolated-test-only
      AI_MODEL: mock-history
      AI_STREAM: "0"
  mock-ai:
    image: python:3.12-slim
    command: [python, /harness/mock_ai.py]
    volumes:
      - ./scripts/mock_ai.py:/harness/mock_ai.py:ro
  test-tls:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/test-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.runtime/ci-tls:/etc/nginx/tls:ro
    depends_on: [web]
